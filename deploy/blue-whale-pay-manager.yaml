# 蓝鲸支付 · 运营平台（pay-manager，端口 9217）
#
# 镜像：火山 CR，由 blue_whale_pay_server/.volcano/pipeline-pay-manager.yml 构建
#       （region=cn-beijing, registryInstance=blue-whale, repo=blue_whale_pay_manager）
#       路径前缀按兄弟仓 blue-whale-ai/deploy 的实际写法取 `bluewhale/`。
#
# 配置注入：application.yml 由 ConfigMap 以 subPath 挂到
#   /jeepayhomes/service/app/application.yml
# 与 Dockerfile CMD 的 --spring.config.additional-location=file:/jeepayhomes/service/app/application.yml 对齐。
# subPath 不热更新：改 ConfigMap 后需 kubectl rollout restart deployment/pay-manager。
#
# apply 前置条件：
#   1. Secret ccr-secret（镜像拉取，与 blue-whale-ai 集群共用）
#   2. Secret blue-whale-pay-secrets，至少包含：
#        DB_HOST DB_PORT DB_NAME DB_USERNAME DB_PASSWORD
#        REDIS_HOST REDIS_PORT REDIS_PASSWORD
#        ROCKETMQ_NAMESRV ROCKETMQ_ACCESS_KEY ROCKETMQ_SECRET_KEY
#        TOS_ACCESS_KEY TOS_SECRET_KEY
#        TOS_ENDPOINT TOS_REGION TOS_PUBLIC_BUCKET TOS_PRIVATE_BUCKET TOS_DOMAIN TOS_PREFIX
#        MGR_JWT_SECRET
#        TLS_ENDPOINT TLS_REGION TLS_TOPIC_ID TLS_AK TLS_SK   （缺省不影响启动）
#   3. 集群内可达的 MySQL / Redis / RocketMQ
#
# 说明：manager 无 @Scheduled 任务、无 WebSocket，可多副本；
#       但运营平台是低频后台系统，默认 1 副本够用，扩容直接改 replicas。

apiVersion: v1
kind: ConfigMap
metadata:
  name: pay-manager-config
  namespace: default
data:
  application.yml: |
    server:
      port: 9217
      servlet:
        context-path: /
      # 识别 X-Forwarded-*：外层反代（HTTPS / 域名）下重定向与 Cookie domain 行为才正确
      forward-headers-strategy: framework
      shutdown: graceful
    spring:
      application:
        name: bluewhale-pay-manager
      lifecycle:
        timeout-per-shutdown-phase: 30s
      main:
        allow-circular-references: true
      servlet:
        multipart:
          enabled: true
          max-request-size: 10MB
          max-file-size: 10MB
      web:
        resources:
          static-locations: classpath:/static
      freemarker:
        template-loader-path: classpath:/templates
        template-encoding: UTF-8
        suffix: .ftl
        settings:
          classic_compatible: true
          number_format: '#'
      datasource:
        url: "jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:blue_whale_pay}?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:}
        druid:
          initial-size: 5
          min-idle: 5
          max-active: 30
          max-wait: 60000
          test-while-idle: true
          test-on-borrow: false
          test-on-return: false
          time-between-eviction-runs-millis: 60000
          min-evictable-idle-time-millis: 300000
          validation-query: SELECT 1 FROM DUAL
          pool-prepared-statements: false
          max-pool-prepared-statement-per-connection-size: 20
          filters: stat,wall
          connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      cache:
        type: redis
      data:
        redis:
          host: ${REDIS_HOST:redis}
          port: ${REDIS_PORT:6379}
          # 1库：运营平台  #2库：商户系统 #3库：支付网关 —— 三服务分别占用，勿改
          database: 1
          timeout: 1000
          password: ${REDIS_PASSWORD:}
    logging:
      level:
        root: info
        # 需要打印 SQL 时临时改 debug，改完记得 rollout restart
        com.blue.whale.pay: info
      path: /jeepayhomes/service/logs
    springdoc:
      swagger-ui:
        path: /swagger-ui.html
        tags-sorter: alpha
        operations-sorter: alpha
      api-docs:
        path: /v3/api-docs
      group-configs:
        - group: 'default'
          paths-to-match: '/**'
          packages-to-scan: com.blue.whale.pay.mgr.ctrl
    knife4j:
      enable: true
    isys:
      # 各系统必须使用各自独立的 jwt secret；换值会让已登录会话全部失效
      jwt-secret: ${MGR_JWT_SECRET}
      allow-cors: true
      cache-config: false
      oss:
        file-root-path: /jeepayhomes/service/uploads
        file-public-path: ${isys.oss.file-root-path}/public
        file-private-path: ${isys.oss.file-root-path}/private
        service-type: volc-tos
        volcengine-tos:
          endpoint: ${TOS_ENDPOINT:https://tos-cn-beijing.volces.com}
          region: ${TOS_REGION:cn-beijing}
          public-bucket-name: ${TOS_PUBLIC_BUCKET:sweet-oa}
          private-bucket-name: ${TOS_PRIVATE_BUCKET:sweet-oa}
          access-key: ${TOS_ACCESS_KEY}
          secret-key: ${TOS_SECRET_KEY}
          domain: ${TOS_DOMAIN:https://sweet-oa.tos-cn-beijing.volces.com}
          prefix: ${TOS_PREFIX:bluewhale-pay}
      # 火山 TLS 日志上报；缺凭证时 TlsLogAppender 自动跳过，仅保留本地日志
      tls:
        endpoint: ${TLS_ENDPOINT:}
        region: ${TLS_REGION:}
        topic-id: ${TLS_TOPIC_ID:}
        access-key: ${TLS_AK:}
        secret-key: ${TLS_SK:}
        container: ${CONTAINER_NAME:pay-manager}
        env: ${ENV:prod}
        version: ${TLS_VERSION:}
      mq:
        vender: rocketMQ
    rocketmq:
      name-server: ${ROCKETMQ_NAMESRV:rocketmq-namesrv:9876}
      producer:
        group: PID_BLUE_WHALE_PAY_MANAGER
        access-key: ${ROCKETMQ_ACCESS_KEY}
        secret-key: ${ROCKETMQ_SECRET_KEY}
        send-message-timeout: 10000
        retry-times-when-send-failed: 2
        retry-times-when-send-async-failed: 2
      consumer:
        access-key: ${ROCKETMQ_ACCESS_KEY}
        secret-key: ${ROCKETMQ_SECRET_KEY}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pay-manager
  namespace: default
  labels:
    app: pay-manager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pay-manager
  template:
    metadata:
      labels:
        app: pay-manager
    spec:
      terminationGracePeriodSeconds: 45
      imagePullSecrets:
      - name: ccr-secret
      containers:
      - name: pay-manager
        # $(tag) 由流水线发布步骤注入（参数 image_tag），与 backend-prod 一致。
        # 直接 kubectl apply 时需先把 $(tag) 替换成具体版本号。
        image: "xf-bluewhale-cn-beijing.cr.volces.com/bluewhale/blue_whale_pay_manager:$(tag)"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9217
          protocol: TCP
        env:
        # 容器感知堆上限，避免 JVM 按宿主内存而非 limit 分配
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75"
        - name: TZ
          value: Asia/Shanghai
        - name: CONTAINER_NAME
          value: "pay-manager"
        - name: ENV
          value: "prod"
        - name: DB_HOST
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: DB_HOST}
        - name: DB_PORT
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: DB_PORT}
        - name: DB_NAME
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: DB_NAME}
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: DB_USERNAME}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: DB_PASSWORD}
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: REDIS_HOST}
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: REDIS_PORT}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: REDIS_PASSWORD}
        - name: ROCKETMQ_NAMESRV
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: ROCKETMQ_NAMESRV}
        - name: ROCKETMQ_ACCESS_KEY
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: ROCKETMQ_ACCESS_KEY}
        - name: ROCKETMQ_SECRET_KEY
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: ROCKETMQ_SECRET_KEY}
        - name: MGR_JWT_SECRET
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: MGR_JWT_SECRET}
        - name: TOS_ACCESS_KEY
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TOS_ACCESS_KEY}
        - name: TOS_SECRET_KEY
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TOS_SECRET_KEY}
        - name: TOS_ENDPOINT
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TOS_ENDPOINT}
        - name: TOS_REGION
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TOS_REGION}
        - name: TOS_PUBLIC_BUCKET
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TOS_PUBLIC_BUCKET}
        - name: TOS_PRIVATE_BUCKET
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TOS_PRIVATE_BUCKET}
        - name: TOS_DOMAIN
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TOS_DOMAIN}
        - name: TOS_PREFIX
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TOS_PREFIX}
        # TLS 日志上报为可选能力，缺 key 时不阻塞 Pod 启动
        - name: TLS_ENDPOINT
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TLS_ENDPOINT, optional: true}
        - name: TLS_REGION
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TLS_REGION, optional: true}
        - name: TLS_TOPIC_ID
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TLS_TOPIC_ID, optional: true}
        - name: TLS_AK
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TLS_AK, optional: true}
        - name: TLS_SK
          valueFrom:
            secretKeyRef: {name: blue-whale-pay-secrets, key: TLS_SK, optional: true}
        volumeMounts:
        - name: config
          mountPath: /jeepayhomes/service/app/application.yml
          subPath: application.yml
          readOnly: true
        - name: logs
          mountPath: /jeepayhomes/service/logs
        # 运营平台渠道配置页上传的证书等
        - name: uploads
          mountPath: /jeepayhomes/service/uploads
        readinessProbe:
          tcpSocket:
            port: 9217
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 9217
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 2Gi
      volumes:
      - name: config
        configMap:
          name: pay-manager-config
      - name: logs
        emptyDir: {}
      - name: uploads
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pay-manager-svc
  namespace: default
spec:
  # 集群内访问：http://pay-manager-svc:9217
  # 运营平台前端 pay-ui-manager 的 BACKEND_HOST 指向此地址
  type: ClusterIP
  selector:
    app: pay-manager
  ports:
  - name: http
    port: 9217
    targetPort: 9217
    protocol: TCP
